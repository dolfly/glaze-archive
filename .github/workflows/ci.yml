name: ci

# This fork exists to carry one change upstream does not have yet: a macOS
# WKWebView snapshot. Its CI therefore proves exactly what runvm depends on —
# every platform still builds (so a runvm `replace` cannot break Linux or
# Windows), and the snapshot actually returns painted pixels on macOS.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  snapshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: snapshot test (real pixels, not just bytes)
        run: go test -run 'TestSnapshot' -v ./...
